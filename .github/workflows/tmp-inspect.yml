name: Tmp Inspect

# 临时诊断工作流：读取当前 Worker 的绑定/兼容性配置与 D1 数据库 ID（不打印任何变量值/密钥）
# 用完立即删除
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect worker settings and D1 ids
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request

          acct = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          base = f"https://api.cloudflare.com/client/v4/accounts/{acct}"

          def get(path):
              req = urllib.request.Request(base + path, headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          s = get("/workers/scripts/temp-email-api/settings")["result"]
          print("compat_date:", s.get("compatibility_date"))
          print("compat_flags:", s.get("compatibility_flags"))
          for b in s.get("bindings", []):
              safe = {k: v for k, v in b.items() if k not in ("text", "secret", "value")}
              print("binding:", json.dumps(safe, ensure_ascii=False))

          dbs = get("/d1/database")["result"]
          for db in dbs:
              print("d1db:", db.get("name"), db.get("uuid"))
          PY
